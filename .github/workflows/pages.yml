name: Deploy press hub to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Package press downloads
        run: |
          rm -f assets/press-kit/mancalero-press-kit.zip assets/downloads/mancalero-broll.zip
          zip -r -q assets/press-kit/mancalero-press-kit.zip assets/branding assets/logos assets/screenshots/launch assets/trailers/mancalero-launch-trailer-* assets/press-kit/README.txt SUBMISSION_KIT.md
          zip -r -q assets/downloads/mancalero-broll.zip assets/trailers/mancalero-launch-trailer-november-2026.mp4 assets/clips/*.mp4 assets/loops/*.mp4

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
